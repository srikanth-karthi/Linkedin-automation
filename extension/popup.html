<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LinkedIn Auto Sender</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      padding: 20px;
      width: 270px;
      height: 180px;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 115, 177, 0.15);
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h3 {
      color: #004182;
      text-align: center;
      font-size: 18px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    #runScript {
      background: linear-gradient(to right, #0073b1, #00a0dc);
      color: white;
      border: none;
      padding: 14px 0;
      font-weight: 600;
      font-size: 15px;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 0 rgba(0, 115, 177, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    #runScript:hover {
      box-shadow: 0 0 10px rgba(0, 160, 220, 0.6);
      transform: translateY(-1px);
    }

    #runScript.running {
      background: linear-gradient(to right, #d93025, #ff5c5c);
      animation: pulseGlow 1s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 8px rgba(217, 48, 37, 0.5); }
      50% { box-shadow: 0 0 16px rgba(217, 48, 37, 0.8); }
      100% { box-shadow: 0 0 8px rgba(217, 48, 37, 0.5); }
    }
  </style>
</head>
<body>
  <h3>🚀 LinkedIn Auto Sender</h3>
  <button id="runScript">▶️ Run</button>
  <script src="popup.js"></script>
</body>
</html>
